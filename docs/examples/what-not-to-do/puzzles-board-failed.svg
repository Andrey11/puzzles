<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="800"
  height="800"
  viewBox="0 0 800 800"
  version="1.1"
  id="puzzles-board-failed"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>FAILED example — do not ship</title>
  <desc>
    Cautionary rewrite of puzzles.svg. Four gem-tile symbols and 25 use
    instances. This is not a replacement for the original Inkscape board.
    See docs/examples/what-not-to-do/README.md.
  </desc>

  <defs>
    <linearGradient id="gem-highlight" x1="18%" y1="8%" x2="78%" y2="92%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72" />
      <stop offset="28%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="62%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38" />
    </linearGradient>

    <radialGradient id="gem-sheen" cx="28%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter id="gem-glow-dark" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
      <feFlood flood-color="#111111" flood-opacity="0.55" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="gem-glow-match" x="-22%" y="-22%" width="144%" height="144%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur" />
      <feFlood flood-color="#ff9955" flood-opacity="0.55" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="gem-glow-exact" x="-22%" y="-22%" width="144%" height="144%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur" />
      <feFlood flood-color="#03bb00" flood-opacity="0.5" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <symbol id="tile-dark" viewBox="0 0 200 200">
      <g filter="url(#gem-glow-dark)">
        <rect width="200" height="200" rx="12" ry="12" fill="#373535" />
        <rect width="200" height="200" rx="12" ry="12" fill="url(#gem-highlight)" />
        <rect width="200" height="200" rx="12" ry="12" fill="url(#gem-sheen)" />
      </g>
    </symbol>

    <symbol id="tile-match" viewBox="0 0 200 200">
      <g filter="url(#gem-glow-match)">
        <rect width="200" height="200" rx="12" ry="12" fill="#ff9955" />
        <rect width="200" height="200" rx="12" ry="12" fill="url(#gem-highlight)" />
        <rect width="200" height="200" rx="12" ry="12" fill="url(#gem-sheen)" />
      </g>
    </symbol>

    <symbol id="tile-exact" viewBox="0 0 200 200">
      <g filter="url(#gem-glow-exact)">
        <rect width="200" height="200" rx="12" ry="12" fill="#03bb00" />
        <rect width="200" height="200" rx="12" ry="12" fill="url(#gem-highlight)" />
        <rect width="200" height="200" rx="12" ry="12" fill="url(#gem-sheen)" />
      </g>
    </symbol>

    <symbol id="tile-match-round" viewBox="0 0 200 200">
      <g filter="url(#gem-glow-match)">
        <rect width="200" height="200" rx="48" ry="48" fill="#ff9955" />
        <rect width="200" height="200" rx="48" ry="48" fill="url(#gem-highlight)" />
        <rect width="200" height="200" rx="48" ry="48" fill="url(#gem-sheen)" />
      </g>
    </symbol>
  </defs>

  <g
    id="board"
    transform="matrix(0.67055688, 0, 0, 0.67050052, 7.957291, -13.577604)">
    <use href="#tile-dark" xlink:href="#tile-dark" x="20" y="20" width="200" height="200" />
    <use href="#tile-match" xlink:href="#tile-match" x="260" y="20" width="200" height="200" />
    <use href="#tile-match" xlink:href="#tile-match" x="500" y="20" width="200" height="200" />
    <use href="#tile-match" xlink:href="#tile-match" x="740" y="20" width="200" height="200" />
    <use href="#tile-dark" xlink:href="#tile-dark" x="980" y="20" width="200" height="200" />

    <use href="#tile-match" xlink:href="#tile-match" x="20" y="260" width="200" height="200" />
    <use href="#tile-exact" xlink:href="#tile-exact" x="260" y="260" width="200" height="200" />
    <use href="#tile-exact" xlink:href="#tile-exact" x="500" y="260" width="200" height="200" />
    <use href="#tile-exact" xlink:href="#tile-exact" x="740" y="260" width="200" height="200" />
    <use href="#tile-match" xlink:href="#tile-match" x="980" y="260" width="200" height="200" />

    <use href="#tile-match" xlink:href="#tile-match" x="20" y="500" width="200" height="200" />
    <use href="#tile-exact" xlink:href="#tile-exact" x="260" y="500" width="200" height="200" />
    <use href="#tile-match-round" xlink:href="#tile-match-round" x="500" y="500" width="200" height="200" />
    <use href="#tile-exact" xlink:href="#tile-exact" x="740" y="500" width="200" height="200" />
    <use href="#tile-match" xlink:href="#tile-match" x="980" y="500" width="200" height="200" />

    <use href="#tile-match" xlink:href="#tile-match" x="20" y="740" width="200" height="200" />
    <use href="#tile-exact" xlink:href="#tile-exact" x="260" y="740" width="200" height="200" />
    <use href="#tile-exact" xlink:href="#tile-exact" x="500" y="740" width="200" height="200" />
    <use href="#tile-exact" xlink:href="#tile-exact" x="740" y="740" width="200" height="200" />
    <use href="#tile-match" xlink:href="#tile-match" x="980" y="740" width="200" height="200" />

    <use href="#tile-dark" xlink:href="#tile-dark" x="20" y="980" width="200" height="200" />
    <use href="#tile-exact" xlink:href="#tile-exact" x="260" y="980" width="200" height="200" />
    <use href="#tile-match" xlink:href="#tile-match" x="500" y="980" width="200" height="200" />
    <use href="#tile-match" xlink:href="#tile-match" x="740" y="980" width="200" height="200" />
    <use href="#tile-dark" xlink:href="#tile-dark" x="980" y="980" width="200" height="200" />
  </g>
</svg>
